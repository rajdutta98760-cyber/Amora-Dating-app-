name: Android Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Puts Gradle 8.9 on the PATH (required by AGP 8.7.2); setup.sh uses it to create the wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: store the full contents of google-services.json in a repository secret named
      # GOOGLE_SERVICES_JSON to use it instead of the copy embedded in setup.sh.
      # With no secret set, this step does nothing and setup.sh creates the file itself.
      - name: Use google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from the GOOGLE_SERVICES_JSON secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret set; setup.sh will create the file"
          fi

      - name: Generate project files
        run: bash setup.sh

      - name: Verify google-services.json
        run: |
          test -f app/google-services.json || { echo "app/google-services.json is missing"; exit 1; }
          python3 -c "import json; json.load(open('app/google-services.json'))" \
            || { echo "app/google-services.json is not valid JSON"; exit 1; }
          grep -q '"package_name": *"Com.DR.AmoraDating"' app/google-services.json \
            || { echo "package_name in google-services.json must be exactly Com.DR.AmoraDating"; exit 1; }
          echo "google-services.json looks good"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

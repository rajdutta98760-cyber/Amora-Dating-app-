name: Android Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Puts Gradle 8.9 on the PATH (required by AGP 8.7.2); setup.sh uses it to create the wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Creates the project and places a validated app/google-services.json
      # (a stale or mismatched copy is replaced and saved as google-services.json.bak)
      - name: Generate project files
        run: bash setup.sh

      - name: Verify app/google-services.json
        run: |
          test -f app/google-services.json || { echo "app/google-services.json is missing"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("app/google-services.json"))
          clients = d.get("client", [])
          match = [c for c in clients
                   if c["client_info"]["android_client_info"]["package_name"] == "Com.amoradatingapp"]
          if not match:
              sys.exit("No client for package Com.amoradatingapp (the match is case-sensitive)")
          print("project_id :", d["project_info"]["project_id"])
          print("package    :", match[0]["client_info"]["android_client_info"]["package_name"])
          print("app id     :", match[0]["client_info"]["mobilesdk_app_id"])
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # The Google Services plugin must have turned google-services.json into Android resources.
      # If it did not, the app would crash with "Default FirebaseApp is not initialized".
      - name: Verify Firebase resources were generated
        run: |
          APP_ID=$(python3 -c "import json; print(json.load(open('app/google-services.json'))['client'][0]['client_info']['mobilesdk_app_id'])")
          FILE=$(grep -rl --include=values.xml "google_app_id" app/build 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No generated google_app_id resource found: the Google Services plugin did not run."
            exit 1
          fi
          grep -q "$APP_ID" "$FILE" || { echo "google_app_id in $FILE does not match $APP_ID"; exit 1; }
          echo "Firebase resources generated from google-services.json ($FILE)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
